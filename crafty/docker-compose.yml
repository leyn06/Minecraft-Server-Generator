services:
  app_proxy:
    environment:
      APP_HOST: crafty_web_1
      APP_PORT: 8080

  # TLS-terminating sidecar. Crafty's web UI is HTTPS-only with a
  # self-signed certificate, so this nginx front terminates TLS and serves
  # plain HTTP to Umbrel's app_proxy.
  web:
    image: nginx:1.27@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - crafty

  crafty:
    image: arcadiatechnology/crafty-4:4.11.0@sha256:7b6e87514259549647e15ceeaf73d238792e6d77e2c79fc744d5badc8d6e997c
    restart: on-failure
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "25565:25565" # Minecraft Java (main server)
      - "25500-25509:25500-25509" # Minecraft Java (extra servers)
      - "19132:19132/udp" # Minecraft Bedrock
    volumes:
      - ${APP_DATA_DIR}/data/config:/crafty/app/config
      - ${APP_DATA_DIR}/data/servers:/crafty/servers
      - ${APP_DATA_DIR}/data/backups:/crafty/backups
      - ${APP_DATA_DIR}/data/logs:/crafty/logs
      - ${APP_DATA_DIR}/data/import:/crafty/import
