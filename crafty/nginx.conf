# TLS-terminating front for Crafty Controller.
#
# Crafty's web UI only listens in HTTPS with a self-signed certificate on
# port 8443 (see upstream docs: "Use HTTPS, not HTTP"). Umbrel's app_proxy
# speaks plain HTTP, so this nginx service terminates the TLS hop and
# forwards everything, including websockets for the live server console.
#
# Based on the upstream-recommended nginx configuration:
# https://docs.craftycontrol.com/pages/getting-started/proxies/

server {
    listen 8080;
    server_name _;

    # Crafty's web UI allows uploading server zips through the file manager.
    client_max_body_size 0;

    location / {
        proxy_pass https://crafty:8443;

        proxy_http_version 1.1;
        proxy_redirect off;

        # Required for websockets (live console, stats).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Crafty's certificate is self-signed by design.
        proxy_ssl_verify off;

        # Live console streams: disable buffering and allow long-lived
        # connections.
        proxy_buffering off;
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
